; ROBO HIN — PlatformIO
;   pio run                 build firmware chính
;   pio run -t upload       nạp
;   pio run -e ex06         build example 06 (ex01 … ex08)
;   pio run -t uploadfs     nạp giao diện web (web/ được nén tự động vào data/www/)
;   pio test -e native      unit test trên PC (cần gcc/g++ trong PATH)

[platformio]
default_envs = esp32dev

[env]
build_flags = -std=gnu++17 -Wall -Wextra
build_unflags = -std=gnu++11

[esp32]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
board_build.filesystem = littlefs
build_flags =
    ${env.build_flags}
    -DCORE_DEBUG_LEVEL=3
    -DHIN_LOG_LEVEL=3
    -DCONFIG_ASYNC_TCP_RUNNING_CORE=0
lib_deps =
    bblanchon/ArduinoJson@^7
    ESP32Async/AsyncTCP@^3.4
    ESP32Async/ESPAsyncWebServer@^3.7
lib_ignore =
    ESPAsyncTCP
    RPAsyncTCP
; nén web/ → data/www/*.gz trước mỗi lần build
extra_scripts = pre:tools/gzip_www.py

[env:esp32dev]
extends = esp32

; ---- Examples: mỗi env build 1 thư mục trong examples/ thay cho src/ ----
[env:ex01]
extends = esp32
build_src_filter = -<*> +<../examples/01_single_stepper/>

[env:ex02]
extends = esp32
build_src_filter = -<*> +<../examples/02_read_mt6701/>

[env:ex03]
extends = esp32
build_src_filter = -<*> +<../examples/03_joint_closed_loop/>

[env:ex04]
extends = esp32
build_src_filter = -<*> +<../examples/04_homing_z/>

[env:ex05]
extends = esp32
build_src_filter = -<*> +<../examples/05_multi_axis_moveJ/>

[env:ex06]
extends = esp32
build_src_filter = -<*> +<../examples/06_scara_moveL/>

[env:ex07]
extends = esp32
build_src_filter = -<*> +<../examples/07_serial_gcode/>

[env:ex08]
extends = esp32
build_src_filter = -<*> +<../examples/08_web_control/>

; ---- Unit test thuần C++ (kinematics, profile, giải mã encoder) trên PC ----
[env:native]
platform = native
test_framework = unity
test_filter = test_kinematics, test_profile, test_mt6701_decode
build_flags = ${env.build_flags} -DHIN_NATIVE
lib_compat_mode = off
