<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 980 410" width="980" height="410" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .h { font-size:13px; font-weight:700; fill:#111; }
    .t { font-size:12px; fill:#333; }
    .s { font-size:11px; fill:#222; text-anchor:middle; }
    .a { fill:#bbdefb; stroke:#1565c0; }
    .x { fill:#eeeeee; stroke:#9e9e9e; }
  </style>
  <rect width="980" height="410" fill="#fafafa"/>
  <text x="490" y="26" text-anchor="middle" font-size="16" font-weight="700" fill="#111">MT6701 module (I2C) — chân, thanh ghi góc và giao dịch đọc</text>

  <!-- ===== Module pinout ===== -->
  <text x="130" y="58" text-anchor="middle" class="h" fill="#555">MODULE</text>
  <rect x="50" y="70" width="160" height="120" rx="8" fill="#2e7d32" stroke="#1b5e20" stroke-width="2"/>
  <rect x="110" y="105" width="40" height="40" rx="3" fill="#212121"/>
  <text x="130" y="130" text-anchor="middle" font-size="9" fill="#fff">MT6701</text>
  <circle cx="130" cy="125" r="34" fill="none" stroke="#a5d6a7" stroke-dasharray="3 3"/>
  <g fill="#ffd54f" stroke="#8d6e00">
    <rect x="62" y="178" width="16" height="16"/><rect x="92" y="178" width="16" height="16"/>
    <rect x="122" y="178" width="16" height="16"/><rect x="152" y="178" width="16" height="16"/>
    <rect x="182" y="178" width="16" height="16"/>
  </g>
  <g class="s">
    <text x="70" y="212" class="s">GND</text><text x="100" y="212" class="s">VDD</text>
    <text x="130" y="212" class="s">OUT</text><text x="160" y="212" class="s">SCL</text>
    <text x="190" y="212" class="s">SDA</text>
  </g>
  <text x="30" y="236" class="t">GND → GND chung</text>
  <text x="30" y="252" class="t">VDD → <tspan font-weight="700" fill="#c62828">3V3</tspan></text>
  <text x="30" y="268" class="t">OUT → analog, <tspan fill="#9e9e9e">không dùng</tspan></text>
  <text x="30" y="284" class="t">SCL/SDA → kênh TCA9548A</text>

  <path d="M250,50 V300" stroke="#ddd"/>

  <!-- ===== Registers ===== -->
  <text x="600" y="58" text-anchor="middle" class="h" fill="#555">THANH GHI GÓC (14 bit)</text>
  <text x="300" y="92" class="h">0x03</text>
  <text x="300" y="142" class="h">0x04</text>
  <g stroke-width="1.2">
    <rect x="350" y="72" width="40" height="30" class="a"/><rect x="390" y="72" width="40" height="30" class="a"/>
    <rect x="430" y="72" width="40" height="30" class="a"/><rect x="470" y="72" width="40" height="30" class="a"/>
    <rect x="510" y="72" width="40" height="30" class="a"/><rect x="550" y="72" width="40" height="30" class="a"/>
    <rect x="590" y="72" width="40" height="30" class="a"/><rect x="630" y="72" width="40" height="30" class="a"/>
    <rect x="350" y="122" width="40" height="30" class="a"/><rect x="390" y="122" width="40" height="30" class="a"/>
    <rect x="430" y="122" width="40" height="30" class="a"/><rect x="470" y="122" width="40" height="30" class="a"/>
    <rect x="510" y="122" width="40" height="30" class="a"/><rect x="550" y="122" width="40" height="30" class="a"/>
    <rect x="590" y="122" width="40" height="30" class="x"/><rect x="630" y="122" width="40" height="30" class="x"/>
  </g>
  <g>
    <text x="370" y="92" class="s">A13</text><text x="410" y="92" class="s">A12</text><text x="450" y="92" class="s">A11</text><text x="490" y="92" class="s">A10</text>
    <text x="530" y="92" class="s">A9</text><text x="570" y="92" class="s">A8</text><text x="610" y="92" class="s">A7</text><text x="650" y="92" class="s">A6</text>
    <text x="370" y="142" class="s">A5</text><text x="410" y="142" class="s">A4</text><text x="450" y="142" class="s">A3</text><text x="490" y="142" class="s">A2</text>
    <text x="530" y="142" class="s">A1</text><text x="570" y="142" class="s">A0</text><text x="610" y="142" class="s">—</text><text x="650" y="142" class="s">—</text>
  </g>
  <text x="690" y="92" class="t">bit 7 … 0</text>
  <text x="690" y="142" class="t">bit 7 … 2 (bit 1:0 bỏ qua)</text>
  <text x="350" y="182" class="t" font-family="Consolas, monospace">raw   = (R[0x03] &lt;&lt; 6) | (R[0x04] &gt;&gt; 2);   // 0 … 16383</text>
  <text x="350" y="200" class="t" font-family="Consolas, monospace">angle = raw × 360 / 16384;               // ≈ 0.022° / LSB</text>
  <text x="350" y="224" class="t" fill="#e65100">ℹ Đối chiếu địa chỉ thanh ghi với datasheet MT6701 khi viết driver</text>

  <!-- ===== Transaction ===== -->
  <g transform="translate(0,52)">
  <text x="490" y="262" text-anchor="middle" class="h" fill="#555">MỘT LẦN ĐỌC (burst 2 byte) · ~120 µs @ 400 kHz</text>
  <g stroke="#555" stroke-width="1">
    <rect x="40"  y="276" width="44"  height="32" fill="#e0e0e0"/>
    <rect x="84"  y="276" width="120" height="32" fill="#ede7f6"/>
    <rect x="204" y="276" width="90"  height="32" fill="#fff3e0"/>
    <rect x="294" y="276" width="44"  height="32" fill="#e0e0e0"/>
    <rect x="338" y="276" width="120" height="32" fill="#ede7f6"/>
    <rect x="458" y="276" width="160" height="32" fill="#bbdefb"/>
    <rect x="618" y="276" width="160" height="32" fill="#bbdefb"/>
    <rect x="778" y="276" width="44"  height="32" fill="#e0e0e0"/>
  </g>
  <g>
    <text x="62"  y="296" class="s">S</text>
    <text x="144" y="296" class="s">0x06 + W</text>
    <text x="249" y="296" class="s">reg 0x03</text>
    <text x="316" y="296" class="s">Sr</text>
    <text x="398" y="296" class="s">0x06 + R</text>
    <text x="538" y="296" class="s">data 0x03 → A13..A6</text>
    <text x="698" y="296" class="s">data 0x04 → A5..A0</text>
    <text x="800" y="296" class="s">P</text>
  </g>
  <text x="40" y="332" class="t">Trước mỗi lần đọc: ghi 1 byte vào TCA9548A (0x70) để chọn kênh của khớp cần đọc · 4 khớp ≈ 0.6 ms → encoderTask 250–500 Hz</text>
  <text x="40" y="350" class="t">Không có CRC → SDK kiểm tra: NACK/timeout, bước nhảy vô lý so với tốc độ tối đa, đọc lặp khi nghi ngờ</text>
  </g>
</svg>
