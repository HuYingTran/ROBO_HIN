<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 780" width="1200" height="780" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .card  { fill:#ffffff; stroke:#e0e0e0; stroke-width:1; }
    .ct    { font-size:13px; font-weight:700; fill:#263238; }
    .t     { font-size:12px; fill:#455a64; }
    .tb    { font-size:12px; font-weight:700; fill:#263238; }
    .big   { font-size:22px; font-weight:700; fill:#1565c0; font-family:Consolas, monospace; }
    .mono  { font-size:12px; fill:#263238; font-family:Consolas, monospace; }
    .btn   { fill:#eceff1; stroke:#b0bec5; }
    .btnP  { fill:#1565c0; }
    .btnT  { font-size:12px; font-weight:700; fill:#263238; text-anchor:middle; }
    .btnW  { font-size:12px; font-weight:700; fill:#fff; text-anchor:middle; }
    .track { fill:#e0e0e0; }
    .fill  { fill:#64b5f6; }
    .knob  { fill:#1565c0; stroke:#fff; stroke-width:2; }
  </style>

  <rect width="1200" height="780" fill="#f1f3f6"/>

  <!-- ============ HEADER ============ -->
  <rect width="1200" height="60" fill="#263238"/>
  <text x="24" y="38" font-size="20" font-weight="800" fill="#fff">🦾 ROBO HIN</text>
  <text x="180" y="37" font-size="12" fill="#b0bec5">http://robo-hin.local</text>
  <circle cx="420" cy="32" r="6" fill="#66bb6a"/><text x="432" y="36" font-size="12" fill="#e0e0e0">Đã kết nối · WiFi −58 dBm</text>
  <rect x="610" y="18" width="70" height="26" rx="13" fill="#43a047"/><text x="645" y="36" font-size="12" font-weight="700" fill="#fff" text-anchor="middle">IDLE</text>
  <rect x="690" y="18" width="96" height="26" rx="13" fill="#37474f" stroke="#78909c"/><text x="738" y="36" font-size="12" fill="#e0e0e0" text-anchor="middle">✓ Đã homing</text>
  <rect x="796" y="18" width="152" height="26" rx="13" fill="#37474f" stroke="#78909c"/><text x="872" y="36" font-size="12" fill="#e0e0e0" text-anchor="middle">🔒 Bạn đang điều khiển</text>
  <rect x="960" y="10" width="220" height="42" rx="8" fill="#d32f2f" stroke="#7f0000" stroke-width="2"/>
  <text x="1070" y="38" font-size="16" font-weight="800" fill="#fff" text-anchor="middle">⛔ DỪNG KHẨN (Space)</text>

  <!-- ============ LEFT: VISUALIZATION ============ -->
  <rect x="16" y="76" width="460" height="400" rx="10" class="card"/>
  <text x="32" y="100" class="ct">Mô phỏng · nhìn từ trên</text>
  <text x="460" y="100" class="t" text-anchor="end">click để đặt đích</text>
  <!-- grid -->
  <g stroke="#eef1f4">
    <path d="M40,140 H420 M40,180 H420 M40,220 H420 M40,260 H420 M40,300 H420 M40,340 H420 M40,380 H420 M40,420 H420 M40,460 H420"/>
    <path d="M60,116 V466 M100,116 V466 M140,116 V466 M180,116 V466 M220,116 V466 M260,116 V466 M300,116 V466 M340,116 V466 M380,116 V466 M420,116 V466"/>
  </g>
  <circle cx="200" cy="300" r="162" fill="#e3f2fd" fill-opacity="0.7" stroke="#1565c0" stroke-dasharray="6 4"/>
  <circle cx="200" cy="300" r="18" fill="#fff" stroke="#1565c0" stroke-dasharray="3 3"/>
  <!-- ghost target -->
  <path d="M200,300 L283,240 L340,300" stroke="#90caf9" stroke-width="10" stroke-linecap="round" fill="none" stroke-dasharray="2 6"/>
  <circle cx="340" cy="300" r="9" fill="none" stroke="#e65100" stroke-width="2"/>
  <path d="M330,300 H350 M340,290 V310" stroke="#e65100" stroke-width="2"/>
  <text x="352" y="324" class="t" fill="#e65100">đích (220, 0)</text>
  <!-- arm -->
  <path d="M200,300 L278,227" stroke="#37474f" stroke-width="12" stroke-linecap="round"/>
  <path d="M278,227 L362,240" stroke="#37474f" stroke-width="10" stroke-linecap="round"/>
  <circle cx="200" cy="300" r="7" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <circle cx="278" cy="227" r="7" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <circle cx="362" cy="240" r="7" fill="#ff9800" stroke="#e65100" stroke-width="2"/>
  <path d="M362,230 h14 M362,250 h14 M362,230 v20" stroke="#37474f" stroke-width="3" fill="none"/>
  <!-- trail -->
  <path d="M120,380 Q160,330 230,370 T362,240" stroke="#ab47bc" stroke-width="1.5" fill="none" stroke-dasharray="4 3"/>
  <text x="96" y="398" class="t" fill="#ab47bc">vết TCP</text>
  <!-- Z bar -->
  <rect x="440" y="130" width="16" height="320" rx="8" class="track"/>
  <rect x="440" y="290" width="16" height="160" rx="8" fill="#ffcc80"/>
  <rect x="434" y="284" width="28" height="12" rx="3" fill="#e65100"/>
  <text x="448" y="124" class="t" text-anchor="middle">Z</text>
  <text x="448" y="466" class="t" text-anchor="middle">0</text>

  <!-- ============ LEFT: POSITION ============ -->
  <rect x="16" y="490" width="460" height="104" rx="10" class="card"/>
  <text x="32" y="514" class="ct">Vị trí đầu công cụ (TCP)</text>
  <text x="32" y="540" class="t">X (mm)</text><text x="32" y="570" class="big">222.0</text>
  <text x="142" y="540" class="t">Y (mm)</text><text x="142" y="570" class="big">137.1</text>
  <text x="252" y="540" class="t">Z (mm)</text><text x="252" y="570" class="big">120.0</text>
  <text x="362" y="540" class="t">φ (°)</text><text x="362" y="570" class="big">15.0</text>
  <text x="32" y="588" class="t">Khuỷu: PHẢI · cập nhật 20 Hz</text>

  <!-- ============ LEFT: CONSOLE ============ -->
  <rect x="16" y="608" width="460" height="156" rx="10" fill="#1e272c"/>
  <text x="32" y="632" font-size="13" font-weight="700" fill="#cfd8dc">Console G-code</text>
  <text x="32" y="656" font-size="12" fill="#80cbc4" font-family="Consolas, monospace">&gt; G28</text>
  <text x="32" y="674" font-size="12" fill="#a5d6a7" font-family="Consolas, monospace">&lt; ok  (homing Z: 3.42 s)</text>
  <text x="32" y="692" font-size="12" fill="#80cbc4" font-family="Consolas, monospace">&gt; G1 X200 Y50 Z40 A0 F40</text>
  <text x="32" y="710" font-size="12" fill="#a5d6a7" font-family="Consolas, monospace">&lt; ok</text>
  <rect x="28" y="724" width="436" height="28" rx="6" fill="#263238" stroke="#455a64"/>
  <text x="40" y="743" font-size="12" fill="#78909c" font-family="Consolas, monospace">nhập lệnh… (Enter để gửi)</text>

  <!-- ============ MIDDLE: JOINT JOG ============ -->
  <rect x="490" y="76" width="350" height="270" rx="10" class="card"/>
  <text x="506" y="100" class="ct">Jog khớp</text>
  <text x="824" y="100" class="t" text-anchor="end">giữ nút để chạy</text>
  <!-- rows -->
  <g>
    <text x="506" y="136" class="tb">J1 · Z</text><text x="590" y="136" class="mono">100.00 mm</text>
    <rect x="506" y="146" width="230" height="6" rx="3" class="track"/><rect x="506" y="146" width="115" height="6" rx="3" class="fill"/><circle cx="621" cy="149" r="7" class="knob"/>
    <rect x="750" y="122" width="34" height="34" rx="6" class="btn"/><text x="767" y="144" class="btnT">−</text>
    <rect x="792" y="122" width="34" height="34" rx="6" class="btn"/><text x="809" y="144" class="btnT">+</text>

    <text x="506" y="190" class="tb">J2 · θ₂</text><text x="590" y="190" class="mono">45.01°</text>
    <rect x="506" y="200" width="230" height="6" rx="3" class="track"/><rect x="506" y="200" width="153" height="6" rx="3" class="fill"/><circle cx="659" cy="203" r="7" class="knob"/>
    <rect x="750" y="176" width="34" height="34" rx="6" class="btn"/><text x="767" y="198" class="btnT">−</text>
    <rect x="792" y="176" width="34" height="34" rx="6" class="btn"/><text x="809" y="198" class="btnT">+</text>

    <text x="506" y="244" class="tb">J3 · θ₃</text><text x="590" y="244" class="mono">−29.98°</text>
    <rect x="506" y="254" width="230" height="6" rx="3" class="track"/><rect x="506" y="254" width="91" height="6" rx="3" class="fill"/><circle cx="597" cy="257" r="7" class="knob"/>
    <rect x="750" y="230" width="34" height="34" rx="6" class="btn"/><text x="767" y="252" class="btnT">−</text>
    <rect x="792" y="230" width="34" height="34" rx="6" class="btn"/><text x="809" y="252" class="btnT">+</text>

    <text x="506" y="298" class="tb">J4 · θ₄</text><text x="590" y="298" class="mono">0.00°</text>
    <rect x="506" y="308" width="230" height="6" rx="3" class="track"/><rect x="506" y="308" width="115" height="6" rx="3" class="fill"/><circle cx="621" cy="311" r="7" class="knob"/>
    <rect x="750" y="284" width="34" height="34" rx="6" class="btn"/><text x="767" y="306" class="btnT">−</text>
    <rect x="792" y="284" width="34" height="34" rx="6" class="btn"/><text x="809" y="306" class="btnT">+</text>
  </g>

  <!-- ============ MIDDLE: CARTESIAN JOG ============ -->
  <rect x="490" y="360" width="350" height="234" rx="10" class="card"/>
  <text x="506" y="384" class="ct">Jog Descartes</text>
  <!-- XY pad -->
  <rect x="546" y="400" width="44" height="40" rx="6" class="btn"/><text x="568" y="425" class="btnT">Y+</text>
  <rect x="502" y="444" width="44" height="40" rx="6" class="btn"/><text x="524" y="469" class="btnT">X−</text>
  <rect x="546" y="444" width="44" height="40" rx="6" class="btnP"/><text x="568" y="469" class="btnW">HOME</text>
  <rect x="590" y="444" width="44" height="40" rx="6" class="btn"/><text x="612" y="469" class="btnT">X+</text>
  <rect x="546" y="488" width="44" height="40" rx="6" class="btn"/><text x="568" y="513" class="btnT">Y−</text>
  <!-- Z -->
  <rect x="656" y="400" width="44" height="58" rx="6" class="btn"/><text x="678" y="434" class="btnT">Z ▲</text>
  <rect x="656" y="470" width="44" height="58" rx="6" class="btn"/><text x="678" y="504" class="btnT">Z ▼</text>
  <!-- phi -->
  <rect x="716" y="400" width="54" height="58" rx="6" class="btn"/><text x="743" y="434" class="btnT">φ ⟲</text>
  <rect x="716" y="470" width="54" height="58" rx="6" class="btn"/><text x="743" y="504" class="btnT">φ ⟳</text>
  <text x="786" y="420" class="t">Phím:</text>
  <text x="786" y="438" class="mono">←→↑↓</text>
  <text x="786" y="456" class="mono">PgUp/Dn</text>
  <text x="786" y="474" class="mono">Q / E</text>
  <!-- step chips -->
  <text x="506" y="556" class="t">Bước:</text>
  <rect x="546" y="540" width="46" height="24" rx="12" class="btn"/><text x="569" y="557" class="btnT">0.1</text>
  <rect x="598" y="540" width="46" height="24" rx="12" class="btnP"/><text x="621" y="557" class="btnW">1</text>
  <rect x="650" y="540" width="46" height="24" rx="12" class="btn"/><text x="673" y="557" class="btnT">10</text>
  <rect x="702" y="540" width="60" height="24" rx="12" class="btn"/><text x="732" y="557" class="btnT">liên tục</text>
  <text x="506" y="584" class="t">mm hoặc ° mỗi lần nhấn</text>

  <!-- ============ MIDDLE: SPEED + GRIPPER ============ -->
  <rect x="490" y="608" width="350" height="156" rx="10" class="card"/>
  <text x="506" y="632" class="ct">Tốc độ &amp; tay kẹp</text>
  <text x="506" y="660" class="t">Tốc độ</text><text x="824" y="660" class="tb" text-anchor="end">50 %</text>
  <rect x="506" y="668" width="318" height="6" rx="3" class="track"/><rect x="506" y="668" width="159" height="6" rx="3" class="fill"/><circle cx="665" cy="671" r="7" class="knob"/>
  <text x="506" y="704" class="t">Tay kẹp</text><text x="824" y="704" class="tb" text-anchor="end">80 %</text>
  <rect x="506" y="712" width="318" height="6" rx="3" class="track"/><rect x="506" y="712" width="254" height="6" rx="3" fill="#81c784"/><circle cx="760" cy="715" r="7" fill="#2e7d32" stroke="#fff" stroke-width="2"/>
  <rect x="506" y="728" width="150" height="28" rx="6" class="btn"/><text x="581" y="747" class="btnT">✋ Mở</text>
  <rect x="674" y="728" width="150" height="28" rx="6" class="btnP"/><text x="749" y="747" class="btnW">✊ Kẹp</text>

  <!-- ============ RIGHT: TEACH & PLAY ============ -->
  <rect x="854" y="76" width="330" height="430" rx="10" class="card"/>
  <text x="870" y="100" class="ct">Teach &amp; Play</text>
  <text x="1168" y="100" class="t" text-anchor="end">pick_place.json</text>
  <rect x="870" y="112" width="298" height="26" fill="#eceff1"/>
  <text x="878" y="129" class="tb">#</text><text x="900" y="129" class="tb">Lệnh</text><text x="980" y="129" class="tb">X, Y, Z, φ</text><text x="1112" y="129" class="tb">Kẹp</text>
  <g class="mono">
    <text x="878" y="160" class="mono">1</text><text x="900" y="160" class="mono">moveJ</text><text x="980" y="160" class="mono">200,50,120,0</text><text x="1112" y="160" class="mono">mở</text>
    <text x="878" y="188" class="mono">2</text><text x="900" y="188" class="mono">moveL</text><text x="980" y="188" class="mono">200,50,40,0</text><text x="1112" y="188" class="mono">kẹp</text>
    <text x="878" y="216" class="mono">3</text><text x="900" y="216" class="mono">moveL</text><text x="980" y="216" class="mono">200,50,120,0</text><text x="1112" y="216" class="mono">—</text>
    <text x="878" y="244" class="mono">4</text><text x="900" y="244" class="mono">moveJ</text><text x="980" y="244" class="mono">50,220,120,90</text><text x="1112" y="244" class="mono">—</text>
    <text x="878" y="272" class="mono">5</text><text x="900" y="272" class="mono">moveL</text><text x="980" y="272" class="mono">50,220,40,90</text><text x="1112" y="272" class="mono">mở</text>
    <text x="878" y="300" class="mono">6</text><text x="900" y="300" class="mono">wait</text><text x="980" y="300" class="mono">500 ms</text><text x="1112" y="300" class="mono">—</text>
  </g>
  <rect x="870" y="171" width="298" height="24" fill="#1565c0" fill-opacity="0.08" stroke="#1565c0" stroke-width="1"/>
  <text x="1160" y="188" font-size="12" fill="#1565c0" text-anchor="end">▶</text>
  <path d="M870,312 H1168" stroke="#e0e0e0"/>
  <rect x="870" y="326" width="144" height="34" rx="6" class="btn"/><text x="942" y="348" class="btnT">＋ Lưu điểm hiện tại</text>
  <rect x="1024" y="326" width="144" height="34" rx="6" class="btn"/><text x="1096" y="348" class="btnT">✎ Sửa / Xóa</text>
  <rect x="870" y="370" width="144" height="40" rx="6" fill="#43a047"/><text x="942" y="395" class="btnW">▶ Chạy</text>
  <rect x="1024" y="370" width="144" height="40" rx="6" class="btn"/><text x="1096" y="395" class="btnT">⏸ Tạm dừng</text>
  <text x="870" y="436" class="t">Lặp:</text>
  <rect x="906" y="422" width="60" height="22" rx="11" class="btnP"/><text x="936" y="438" class="btnW">∞</text>
  <text x="980" y="438" class="t">Đang chạy bước 2/6 · vòng 14</text>
  <rect x="870" y="456" width="298" height="8" rx="4" class="track"/><rect x="870" y="456" width="99" height="8" rx="4" fill="#43a047"/>
  <text x="870" y="490" class="t">Lưu trên LittleFS · xuất / nhập file .json</text>

  <!-- ============ RIGHT: STATUS ============ -->
  <rect x="854" y="520" width="330" height="244" rx="10" class="card"/>
  <text x="870" y="544" class="ct">Trạng thái hệ thống</text>
  <text x="870" y="572" class="t">Encoder</text>
  <circle cx="950" cy="568" r="6" fill="#43a047"/><text x="960" y="572" class="t">J1</text>
  <circle cx="1000" cy="568" r="6" fill="#43a047"/><text x="1010" y="572" class="t">J2</text>
  <circle cx="1050" cy="568" r="6" fill="#43a047"/><text x="1060" y="572" class="t">J3</text>
  <circle cx="1100" cy="568" r="6" fill="#fbc02d"/><text x="1110" y="572" class="t">J4</text>
  <text x="870" y="598" class="t">Following error</text><text x="1168" y="598" class="mono" text-anchor="end">0.04 mm · 0.3° · 0.2° · 1.1°</text>
  <text x="870" y="622" class="t">Limit Z</text><text x="1168" y="622" class="mono" text-anchor="end">nhả</text>
  <text x="870" y="646" class="t">Lỗi gần nhất</text><text x="1168" y="646" class="mono" text-anchor="end" fill="#f57f17">J4: I2C retry ×2</text>
  <rect x="870" y="664" width="92" height="34" rx="6" class="btn"/><text x="916" y="686" class="btnT">⚡ Enable</text>
  <rect x="972" y="664" width="92" height="34" rx="6" class="btn"/><text x="1018" y="686" class="btnT">Home</text>
  <rect x="1074" y="664" width="94" height="34" rx="6" class="btn"/><text x="1121" y="686" class="btnT">↺ Xóa lỗi</text>
  <rect x="870" y="708" width="298" height="44" rx="6" fill="#fff8e1" stroke="#ffe082"/>
  <text x="880" y="726" class="t">⚠ Nút DỪNG KHẨN trên web là lệnh phần mềm.</text>
  <text x="880" y="743" class="t">Luôn giữ E-stop vật lý trong tầm tay.</text>
</svg>
