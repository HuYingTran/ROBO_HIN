<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1160 730" width="1160" height="730" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .box   { fill:#ffffff; stroke:#333; stroke-width:1.5; rx:8; }
    .esp   { fill:#1f2937; stroke:#111; stroke-width:1.5; }
    .drv   { fill:#e8f5e9; stroke:#2e7d32; stroke-width:1.5; }
    .enc   { fill:#e3f2fd; stroke:#1565c0; stroke-width:1.5; }
    .pwr   { fill:#ffebee; stroke:#c62828; stroke-width:1.5; }
    .t     { font-size:11px; fill:#222; }
    .tw    { font-size:11px; fill:#f5f5f5; }
    .h     { font-size:13px; font-weight:700; fill:#111; }
    .hw    { font-size:14px; font-weight:700; fill:#fff; }
    .vmot  { stroke:#d62828; stroke-width:2.5; fill:none; }
    .v5    { stroke:#f77f00; stroke-width:2; fill:none; }
    .v33   { stroke:#e0a800; stroke-width:2; fill:none; }
    .step  { stroke:#2b9348; stroke-width:2; fill:none; }
    .dir   { stroke:#1d70b8; stroke-width:2; fill:none; }
    .en    { stroke:#7b2cbf; stroke-width:2; fill:none; }
    .spi   { stroke:#0f9d9a; stroke-width:2; fill:none; }
    .sig   { stroke:#555; stroke-width:2; fill:none; }
    .mot   { stroke:#444; stroke-width:4; fill:none; }
    .dot   { stroke:none; }
  </style>

  <rect x="0" y="0" width="1160" height="730" fill="#fafafa"/>
  <text x="580" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">ROBO HIN — Sơ đồ đấu dây (TRRR · 4 trục)</text>

  <!-- ================= POWER ================= -->
  <rect x="40" y="50" width="200" height="60" rx="8" class="pwr"/>
  <text x="140" y="76" text-anchor="middle" class="h">Nguồn 12–24 V</text>
  <text x="140" y="96" text-anchor="middle" class="t">≥ 5 A (VMOT)</text>

  <rect x="40" y="160" width="200" height="56" rx="8" class="pwr"/>
  <text x="140" y="184" text-anchor="middle" class="h">Buck → 5 V</text>
  <text x="140" y="203" text-anchor="middle" class="t">≥ 2 A (ESP32 + servo)</text>
  <path d="M140,110 V160" class="vmot"/>

  <!-- VMOT bus -->
  <path d="M240,80 H950 V468" class="vmot"/>
  <text x="600" y="72" text-anchor="middle" class="t" fill="#d62828">VMOT 12–24 V (+ tụ 100 µF sát mỗi driver)</text>

  <!-- 5V -->
  <path d="M240,188 H420" class="v5"/>
  <text x="300" y="182" class="t">5 V → VIN</text>
  <path d="M330,188 V472 H260" class="v5"/>
  <circle cx="330" cy="188" r="4" fill="#f77f00"/>

  <!-- ================= ESP32 ================= -->
  <rect x="420" y="140" width="220" height="480" rx="10" class="esp"/>
  <text x="530" y="160" text-anchor="middle" class="hw">ESP32 DevKit V1</text>

  <!-- left pins -->
  <text x="430" y="192" class="tw">VIN · 5V</text>
  <text x="430" y="304" class="tw">GPIO21 · SDA</text>
  <text x="430" y="334" class="tw">GPIO22 · SCL</text>
  <text x="430" y="364" class="tw">GPIO19 · MUX RST</text>
  <text x="430" y="394" class="tw">3V3</text>
  <text x="430" y="499" class="tw">GPIO18 · SERVO</text>
  <text x="430" y="592" class="tw">GPIO39 · E-STOP</text>

  <!-- right pins -->
  <text x="630" y="178" text-anchor="end" class="tw">GPIO25 · STEP1</text>
  <text x="630" y="198" text-anchor="end" class="tw">GPIO26 · DIR1</text>
  <text x="630" y="278" text-anchor="end" class="tw">GPIO27 · STEP2</text>
  <text x="630" y="298" text-anchor="end" class="tw">GPIO14 · DIR2</text>
  <text x="630" y="378" text-anchor="end" class="tw">GPIO32 · STEP3</text>
  <text x="630" y="398" text-anchor="end" class="tw">GPIO33 · DIR3</text>
  <text x="630" y="478" text-anchor="end" class="tw">GPIO13 · STEP4</text>
  <text x="630" y="498" text-anchor="end" class="tw">GPIO23 · DIR4</text>
  <text x="630" y="594" text-anchor="end" class="tw">GPIO4 · EN</text>

  <!-- ================= DRIVERS ================= -->
  <!-- J1 -->
  <rect x="760" y="150" width="160" height="76" rx="6" class="drv"/>
  <text x="840" y="192" text-anchor="middle" class="h">A4988 · J1 Z</text>
  <text x="768" y="178" class="t">STEP</text><text x="768" y="198" class="t">DIR</text><text x="768" y="218" class="t">EN</text>
  <text x="912" y="172" text-anchor="end" class="t">VMOT</text><text x="912" y="204" text-anchor="end" class="t">OUT</text>
  <!-- J2 -->
  <rect x="760" y="250" width="160" height="76" rx="6" class="drv"/>
  <text x="840" y="292" text-anchor="middle" class="h">A4988 · J2 θ₂</text>
  <text x="768" y="278" class="t">STEP</text><text x="768" y="298" class="t">DIR</text><text x="768" y="318" class="t">EN</text>
  <text x="912" y="272" text-anchor="end" class="t">VMOT</text><text x="912" y="304" text-anchor="end" class="t">OUT</text>
  <!-- J3 -->
  <rect x="760" y="350" width="160" height="76" rx="6" class="drv"/>
  <text x="840" y="392" text-anchor="middle" class="h">A4988 · J3 θ₃</text>
  <text x="768" y="378" class="t">STEP</text><text x="768" y="398" class="t">DIR</text><text x="768" y="418" class="t">EN</text>
  <text x="912" y="372" text-anchor="end" class="t">VMOT</text><text x="912" y="404" text-anchor="end" class="t">OUT</text>
  <!-- J4 -->
  <rect x="760" y="450" width="160" height="76" rx="6" class="drv"/>
  <text x="840" y="492" text-anchor="middle" class="h">A4988 · J4 θ₄</text>
  <text x="768" y="478" class="t">STEP</text><text x="768" y="498" class="t">DIR</text><text x="768" y="518" class="t">EN</text>
  <text x="912" y="472" text-anchor="end" class="t">VMOT</text><text x="912" y="504" text-anchor="end" class="t">OUT</text>

  <!-- STEP / DIR lines -->
  <path d="M640,174 H760" class="step"/><path d="M640,194 H760" class="dir"/>
  <path d="M640,274 H760" class="step"/><path d="M640,294 H760" class="dir"/>
  <path d="M640,374 H760" class="step"/><path d="M640,394 H760" class="dir"/>
  <path d="M640,474 H760" class="step"/><path d="M640,494 H760" class="dir"/>

  <!-- EN bus -->
  <path d="M640,590 H720 V214 H760 M720,314 H760 M720,414 H760 M720,514 H760" class="en"/>
  <circle cx="720" cy="314" r="4" fill="#7b2cbf"/><circle cx="720" cy="414" r="4" fill="#7b2cbf"/><circle cx="720" cy="514" r="4" fill="#7b2cbf"/>
  <text x="714" y="566" text-anchor="end" class="t" fill="#7b2cbf">EN chung</text>
  <text x="714" y="582" text-anchor="end" class="t" fill="#7b2cbf">pull-up 10k</text>

  <!-- VMOT stubs -->
  <path d="M950,168 H920 M950,268 H920 M950,368 H920 M950,468 H920" class="vmot"/>
  <circle cx="950" cy="168" r="4" fill="#d62828"/><circle cx="950" cy="268" r="4" fill="#d62828"/><circle cx="950" cy="368" r="4" fill="#d62828"/>

  <!-- ================= MOTORS ================= -->
  <text x="1070" y="140" text-anchor="middle" class="h">NEMA 17</text>
  <path d="M920,200 H1040" class="mot"/><path d="M920,300 H1040" class="mot"/>
  <path d="M920,400 H1040" class="mot"/><path d="M920,500 H1040" class="mot"/>
  <g fill="#9e9e9e" stroke="#424242" stroke-width="2">
    <rect x="1040" y="170" width="60" height="60" rx="6"/><rect x="1040" y="270" width="60" height="60" rx="6"/>
    <rect x="1040" y="370" width="60" height="60" rx="6"/><rect x="1040" y="470" width="60" height="60" rx="6"/>
  </g>
  <g fill="#e0e0e0" stroke="#424242" stroke-width="1.5">
    <circle cx="1070" cy="200" r="10"/><circle cx="1070" cy="300" r="10"/><circle cx="1070" cy="400" r="10"/><circle cx="1070" cy="500" r="10"/>
  </g>
  <text x="1106" y="204" class="h">M1</text><text x="1070" y="246" text-anchor="middle" class="t">vít me</text><text x="1110" y="304" class="h">M2</text>
  <text x="1110" y="404" class="h">M3</text><text x="1110" y="504" class="h">M4</text>

  <!-- ================= ENCODERS (I2C qua TCA9548A) ================= -->
  <rect x="30" y="240" width="100" height="34" rx="6" class="enc"/>
  <text x="80" y="255" text-anchor="middle" font-size="11" font-weight="700" fill="#111">MT6701 · J1</text>
  <text x="80" y="268" text-anchor="middle" font-size="10" fill="#333">I2C 0x06</text>
  <path d="M130,257 H190" class="spi" stroke-width="3"/>
  <text x="196" y="261" class="t">CH0</text>
  <rect x="30" y="282" width="100" height="34" rx="6" class="enc"/>
  <text x="80" y="297" text-anchor="middle" font-size="11" font-weight="700" fill="#111">MT6701 · J2</text>
  <text x="80" y="310" text-anchor="middle" font-size="10" fill="#333">I2C 0x06</text>
  <path d="M130,299 H190" class="spi" stroke-width="3"/>
  <text x="196" y="303" class="t">CH1</text>
  <rect x="30" y="324" width="100" height="34" rx="6" class="enc"/>
  <text x="80" y="339" text-anchor="middle" font-size="11" font-weight="700" fill="#111">MT6701 · J3</text>
  <text x="80" y="352" text-anchor="middle" font-size="10" fill="#333">I2C 0x06</text>
  <path d="M130,341 H190" class="spi" stroke-width="3"/>
  <text x="196" y="345" class="t">CH2</text>
  <rect x="30" y="366" width="100" height="34" rx="6" class="enc"/>
  <text x="80" y="381" text-anchor="middle" font-size="11" font-weight="700" fill="#111">MT6701 · J4</text>
  <text x="80" y="394" text-anchor="middle" font-size="10" fill="#333">I2C 0x06</text>
  <path d="M130,383 H190" class="spi" stroke-width="3"/>
  <text x="196" y="387" class="t">CH3</text>
  <rect x="190" y="236" width="110" height="168" rx="8" fill="#ede7f6" stroke="#5e35b1" stroke-width="1.5"/>
  <text x="258" y="258" text-anchor="middle" class="h">TCA9548A</text>
  <text x="258" y="274" text-anchor="middle" class="t">mux I2C · 0x70</text>
  <text x="294" y="304" text-anchor="end" class="t">SDA</text>
  <text x="294" y="334" text-anchor="end" class="t">SCL</text>
  <text x="294" y="364" text-anchor="end" class="t">RST</text>
  <text x="294" y="394" text-anchor="end" class="t">VCC</text>
  <path d="M300,300 H420" class="spi"/>
  <path d="M300,330 H420" class="spi"/>
  <path d="M300,360 H420" class="sig"/>
  <path d="M300,390 H420" class="v33"/>
  <text x="350" y="294" class="t" fill="#0f9d9a">I2C 400 kHz</text>
  <text x="30" y="420" font-size="11" font-weight="700" fill="#c62828">VDD encoder = 3V3 · pull-up về 3V3</text>
  <text x="30" y="436" class="t">SDx/SCx mỗi kênh → SDA/SCL 1 encoder</text>

  <!-- ================= SERVO ================= -->
  <rect x="40" y="460" width="220" height="50" rx="8" class="box"/>
  <text x="150" y="482" text-anchor="middle" class="h">Servo gripper</text>
  <text x="150" y="500" text-anchor="middle" class="t">MG996R · PWM 50 Hz</text>
  <path d="M260,495 H420" class="sig"/>

  <!-- ================= LIMIT Z ================= -->
  <rect x="40" y="518" width="220" height="32" rx="6" fill="#fffde7" stroke="#f57f17" stroke-width="1.5"/>
  <text x="150" y="539" text-anchor="middle" class="h">Limit Z (homing J1)</text>
  <path d="M260,534 H420" class="sig"/>
  <text x="430" y="538" class="tw">GPIO34 · LIMIT Z</text>

  <!-- ================= E-STOP ================= -->
  <rect x="40" y="560" width="220" height="56" rx="8" fill="#fff3e0" stroke="#e65100" stroke-width="1.5"/>
  <circle cx="70" cy="588" r="16" fill="#d32f2f" stroke="#7f0000" stroke-width="2"/>
  <text x="160" y="584" text-anchor="middle" class="h">E-STOP (NC)</text>
  <text x="160" y="602" text-anchor="middle" class="t">pull-up ngoài 10k</text>
  <path d="M260,588 H420" class="sig"/>
  <path d="M150,616 V640 H720 V590" stroke="#7b2cbf" stroke-width="2" stroke-dasharray="6 4" fill="none"/>
  <text x="430" y="634" class="t" fill="#7b2cbf">ngắt cứng EN (độc lập phần mềm)</text>

  <!-- ================= ENCODER MOUNT INSET ================= -->
  <rect x="760" y="560" width="380" height="150" rx="8" fill="#ffffff" stroke="#999" stroke-dasharray="4 3"/>
  <text x="950" y="580" text-anchor="middle" class="h">Gắn MT6701 lên khớp</text>
  <rect x="780" y="628" width="110" height="20" fill="#bdbdbd" stroke="#616161"/>
  <text x="835" y="665" text-anchor="middle" class="t">trục ra khớp</text>
  <rect x="890" y="618" width="26" height="20" fill="#e53935" stroke="#333"/>
  <rect x="890" y="638" width="26" height="20" fill="#1e88e5" stroke="#333"/>
  <text x="903" y="632" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">N</text>
  <text x="903" y="652" text-anchor="middle" font-size="11" font-weight="700" fill="#fff">S</text>
  <rect x="928" y="628" width="7" height="20" fill="#212121"/>
  <rect x="935" y="598" width="8" height="80" fill="#2e7d32"/>
  <path d="M916,608 H928" stroke="#333" stroke-width="1"/>
  <path d="M916,604 V612 M928,604 V612" stroke="#333" stroke-width="1"/>
  <text x="922" y="600" text-anchor="middle" font-size="10" fill="#333">gap</text>
  <text x="955" y="612" class="t">• Khe hở 0.5–3 mm</text>
  <text x="955" y="632" class="t">• Nam châm từ hoá xuyên tâm</text>
  <text x="955" y="652" class="t">• Đồng tâm với trục</text>
  <text x="955" y="672" class="t">• J2–J4: sau bộ truyền</text>
  <text x="955" y="692" class="t">• J1: đầu trục vít me</text>

  <!-- ================= LEGEND ================= -->
  <g transform="translate(40,672)">
    <text x="0" y="4" class="h">Chú thích:</text>
    <path d="M80,0 H110" class="vmot"/><text x="116" y="4" class="t">VMOT</text>
    <path d="M160,0 H190" class="v5"/><text x="196" y="4" class="t">5 V</text>
    <path d="M230,0 H260" class="v33"/><text x="266" y="4" class="t">3V3</text>
    <path d="M300,0 H330" class="step"/><text x="336" y="4" class="t">STEP</text>
    <path d="M380,0 H410" class="dir"/><text x="416" y="4" class="t">DIR</text>
    <path d="M450,0 H480" class="en"/><text x="486" y="4" class="t">EN</text>
    <path d="M520,0 H550" class="spi"/><text x="556" y="4" class="t">I2C</text>
    <path d="M595,0 H625" class="sig"/><text x="631" y="4" class="t">Tín hiệu</text>
    <text x="0" y="30" font-size="12" font-weight="700" fill="#c62828">⚠ Nối GND chung: nguồn VMOT · buck · ESP32 · A4988 · MT6701 · servo</text>
  </g>
</svg>
