<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 560" width="1080" height="560" font-family="Segoe UI, Roboto, Helvetica, Arial, sans-serif">
  <style>
    .link  { stroke:#37474f; stroke-width:18; stroke-linecap:round; fill:none; }
    .lbl   { font-size:13px; font-weight:700; fill:#111; }
    .t     { font-size:12px; fill:#333; }
    .dim   { stroke:#1565c0; stroke-width:1.3; fill:none; }
    .dimt  { font-size:12px; fill:#1565c0; font-weight:600; }
    .axis  { stroke:#9c27b0; stroke-width:1.3; stroke-dasharray:6 4; fill:none; }
    .rot   { stroke:#e65100; stroke-width:2.2; fill:none; }
    .mot   { fill:#90a4ae; stroke:#37474f; stroke-width:1.5; }
    .ang   { stroke:#6a1b9a; stroke-width:2; fill:none; }
  </style>
  <defs>
    <marker id="arrB" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#1565c0"/>
    </marker>
    <marker id="arrO" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#e65100"/>
    </marker>
    <marker id="arrK" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#333"/>
    </marker>
    <pattern id="screw" width="8" height="8" patternUnits="userSpaceOnUse">
      <rect width="8" height="8" fill="#cfd8dc"/>
      <path d="M0,8 L8,0" stroke="#546e7a" stroke-width="2"/>
    </pattern>
  </defs>

  <rect width="1080" height="560" fill="#fafafa"/>
  <text x="540" y="30" text-anchor="middle" font-size="18" font-weight="700" fill="#111">ROBO HIN — Cấu hình TRRR (Z vít me + SCARA 2R + xoay tay kẹp)</text>
  <path d="M556,50 V540" stroke="#ddd" stroke-width="1.5"/>

  <!-- ===================== SIDE VIEW ===================== -->
  <text x="270" y="62" text-anchor="middle" class="lbl" fill="#555">NHÌN NGANG</text>

  <path d="M30,500 H530" stroke="#9e9e9e" stroke-width="2"/>

  <!-- base + J1 motor -->
  <rect x="60" y="462" width="160" height="38" rx="5" fill="#78909c" stroke="#37474f" stroke-width="2"/>
  <rect x="120" y="470" width="40" height="28" class="mot"/>
  <text x="140" y="489" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M1</text>

  <!-- top plate, guide rods, lead screw -->
  <rect x="60" y="100" width="160" height="12" rx="3" fill="#78909c" stroke="#37474f" stroke-width="1.5"/>
  <path d="M84,112 V462 M196,112 V462" stroke="#b0bec5" stroke-width="6"/>
  <rect x="133" y="112" width="14" height="350" fill="url(#screw)" stroke="#546e7a"/>
  <text x="140" y="90" text-anchor="middle" class="t">Vít me T8 + 2 trục dẫn hướng</text>

  <!-- carriage -->
  <rect x="70" y="268" width="140" height="44" rx="5" fill="#ffcc80" stroke="#e65100" stroke-width="2"/>
  <text x="140" y="294" text-anchor="middle" class="lbl">Xe trượt</text>

  <!-- J1 travel -->
  <path d="M40,200 V380" stroke="#e65100" stroke-width="2.5" marker-start="url(#arrO)" marker-end="url(#arrO)"/>
  <text x="32" y="190" class="lbl" fill="#e65100">J1</text>
  <text x="10" y="400" class="t" fill="#e65100">Z (d₁)</text>

  <!-- limit switch -->
  <rect x="96" y="440" width="22" height="12" fill="#ffeb3b" stroke="#f57f17"/>
  <text x="34" y="450" class="t">Limit Z</text>

  <!-- arm links -->
  <path d="M225,290 H375" class="link"/>
  <path d="M375,290 H495" class="link"/>

  <!-- vertical rotation axes -->
  <path d="M225,180 V340 M375,200 V340 M495,200 V420" class="axis"/>

  <!-- J2 -->
  <rect x="210" y="246" width="30" height="30" class="mot"/>
  <text x="225" y="266" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M2</text>
  <ellipse cx="225" cy="225" rx="22" ry="7" class="rot"/>
  <path d="M243,221 l6,4 l-7,3" class="rot"/>
  <text x="225" y="206" text-anchor="middle" class="lbl" fill="#e65100">J2</text>

  <!-- J3 -->
  <rect x="360" y="246" width="30" height="30" class="mot"/>
  <text x="375" y="266" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M3</text>
  <ellipse cx="375" cy="225" rx="22" ry="7" class="rot"/>
  <path d="M393,221 l6,4 l-7,3" class="rot"/>
  <text x="375" y="206" text-anchor="middle" class="lbl" fill="#e65100">J3</text>

  <!-- J4 wrist + gripper -->
  <rect x="480" y="246" width="30" height="30" class="mot"/>
  <text x="495" y="266" text-anchor="middle" font-size="10" fill="#fff" font-weight="700">M4</text>
  <ellipse cx="495" cy="225" rx="22" ry="7" class="rot"/>
  <path d="M513,221 l6,4 l-7,3" class="rot"/>
  <text x="495" y="206" text-anchor="middle" class="lbl" fill="#e65100">J4</text>
  <path d="M495,300 V350" stroke="#37474f" stroke-width="10"/>
  <rect x="477" y="350" width="36" height="14" rx="2" fill="#546e7a"/>
  <path d="M481,364 V392 M509,364 V392" stroke="#37474f" stroke-width="6" stroke-linecap="round"/>
  <circle cx="495" cy="388" r="4" fill="#d32f2f"/>
  <text x="440" y="420" class="lbl" fill="#d32f2f">TCP</text>
  <text x="440" y="384" class="t">servo</text>

  <!-- dimensions -->
  <path d="M225,326 H375" class="dim" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="300" y="344" text-anchor="middle" class="dimt">a₂ = 150</text>
  <path d="M375,326 H495" class="dim" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="435" y="344" text-anchor="middle" class="dimt">a₃ = 120</text>
  <path d="M528,290 V388" class="dim" marker-start="url(#arrB)" marker-end="url(#arrB)"/>
  <text x="540" y="440" class="dimt" text-anchor="end">d₄ = 60</text>

  <text x="385" y="472" text-anchor="middle" class="t">J2, J3, J4 quay quanh trục thẳng đứng (nét tím)</text>
  <text x="270" y="530" text-anchor="middle" class="t">Đơn vị: mm · kích thước là giá trị mẫu</text>

  <!-- ===================== TOP VIEW ===================== -->
  <text x="820" y="62" text-anchor="middle" class="lbl" fill="#555">NHÌN TỪ TRÊN · VÙNG LÀM VIỆC</text>

  <circle cx="820" cy="300" r="216" fill="#e3f2fd" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="6 4"/>
  <circle cx="820" cy="300" r="24" fill="#fafafa" stroke="#1565c0" stroke-width="1.5" stroke-dasharray="4 3"/>
  <text x="640" y="120" class="t" fill="#1565c0">Vùng với tới</text>

  <rect x="776" y="282" width="36" height="36" rx="4" fill="#78909c" stroke="#37474f"/>

  <path d="M820,300 H890" stroke="#c62828" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="894" y="315" class="lbl" fill="#c62828">X</text>
  <path d="M820,300 V250" stroke="#2e7d32" stroke-width="2" marker-end="url(#arrK)"/>
  <text x="804" y="250" class="lbl" fill="#2e7d32">Y</text>

  <!-- links (theta2 = 30°, theta3 = -60°) -->
  <path d="M820,300 L923.9,240" class="link" stroke-width="14"/>
  <path d="M923.9,240 L1007,288" class="link" stroke-width="12"/>
  <path d="M923.9,240 L980,207.6" class="axis" stroke="#6a1b9a"/>
  <circle cx="820" cy="300" r="9" fill="#ff9800" stroke="#e65100" stroke-width="2.5"/>
  <circle cx="923.9" cy="240" r="9" fill="#ff9800" stroke="#e65100" stroke-width="2.5"/>
  <circle cx="1007" cy="288" r="9" fill="#ff9800" stroke="#e65100" stroke-width="2.5"/>

  <g transform="translate(1007,288) rotate(-10)">
    <path d="M0,-12 V12 M0,-12 H22 M0,12 H22" stroke="#37474f" stroke-width="4" fill="none" stroke-linecap="round"/>
  </g>

  <path d="M866,300 A46,46 0 0 0 859.8,277" class="ang"/>
  <text x="872" y="292" class="lbl" fill="#6a1b9a">θ₂</text>
  <path d="M954.2,222.5 A35,35 0 0 1 954.2,257.5" class="ang"/>
  <text x="960" y="246" class="lbl" fill="#6a1b9a">θ₃</text>
  <text x="1016" y="324" class="lbl" fill="#6a1b9a">φ</text>

  <text x="862" y="250" class="dimt">a₂</text>
  <text x="958" y="282" class="dimt">a₃</text>

  <text x="820" y="532" text-anchor="middle" class="t">r_max = a₂ + a₃ = 270 · r_min = |a₂ − a₃| = 30</text>
  <text x="820" y="550" text-anchor="middle" class="t">Hướng tay kẹp: φ = θ₂ + θ₃ + θ₄ · chưa tính giới hạn khớp</text>
</svg>
